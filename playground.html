/* ============================================================
   COLOURS
============================================================ */

:root {

    --night: #05233C;
    --deep: #0A3157;
    --cream: #F5F5DC;
    --muted: #9DB2C4;
    --turquoise: #28B6AC;
    --saffron: #D0674E;

    --line: rgba(245, 245, 220, .16);

    --wrap: min(960px, calc(100% - 64px));

}


/* ============================================================
   RESET
============================================================ */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

}


html {

    scroll-behavior: smooth;

}


body {

    color: var(--cream);

    font-family:

        Helvetica,
        Arial,
        sans-serif;

    overflow-x: hidden;

}


a {

    color: inherit;

    text-decoration: none;

}


button {

    font-family: inherit;

}


::selection {

    background: var(--turquoise);

    color: var(--night);

}


/* ============================================================
   GENERAL
============================================================ */

h1 {

    font-family: "Montserrat", sans-serif;

    font-weight: 400;

}


.page-width {

    width: var(--wrap);

    margin: 0 auto;

}


.rule {

    width: 100%;

    height: 1px;

    background: var(--line);

}


/* ============================================================
   SMALL LINK
============================================================ */

.link {

    display: inline-block;

    margin-top: 18px;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .12em;

    color: var(--saffron);

    border-bottom:
        1px solid var(--saffron);

    padding-bottom: 4px;

    transition:
        color .25s ease,
        border-color .25s ease;

}


.link:hover,
.link:focus-visible {

    color: var(--turquoise);

    border-color: var(--turquoise);

}


/* ============================================================
   NAVIGATION
============================================================ */

.site-nav {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    z-index: 1000;

    padding: 16px 0;

    pointer-events: none;

    background:
        linear-gradient(
            var(--night) 60%,
            transparent
        );

}


.nav-inner {

    width: var(--wrap);

    margin: auto;

    display: flex;

    justify-content: space-between;

    align-items: center;

    pointer-events: auto;

}


.artist-name {

    font-size: 11px;

    font-weight: 500;

    text-transform: uppercase;

    letter-spacing: .2em;

    color: var(--cream);

    white-space: nowrap;

}


.nav-links {

    display: flex;

    gap: 24px;

    list-style: none;

}


.nav-links a {

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .15em;

    color: var(--muted);

    transition: color .2s ease;

}


.nav-links a:hover,
.nav-links a:focus-visible,
.nav-links a.current {

    color: var(--turquoise);

}


/* ============================================================
   PAGE HEADER
============================================================ */

.play-head {

    padding: 110px 0 28px;

}


.play-title {

    font-size:
        clamp(36px, 5.5vw, 58px);

    line-height: .98;

    letter-spacing: -.055em;

}


.play-intro {

    max-width: 420px;

    margin-top: 16px;

    font-size: 13px;

    line-height: 1.7;

    color: var(--muted);

}


/* ============================================================
   GALLERY
============================================================ */

.gallery-section {

    padding: 36px 0 60px;

}


.gallery {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 14px;

}


.shot {

    position: relative;

    display: block;

    width: 100%;

    aspect-ratio: 1 / 1;

    background: var(--deep);

    border: 0;

    overflow: hidden;

    cursor: zoom-in;

    padding: 0;

}


.shot.wide {

    grid-column: span 2;

    aspect-ratio: 2 / 1;

}


.shot.tall {

    grid-row: span 2;

    aspect-ratio: 1 / 2;

}


.shot img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

    transition:
        transform .7s cubic-bezier(.2,.7,.2,1);

}


.shot:hover img,
.shot:focus-visible img {

    transform: scale(1.04);

}


/* ============================================================
   GALLERY CAPTION
============================================================ */

.shot-caption {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 10px 12px;

    text-align: left;

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: .12em;

    color: var(--cream);

    background:
        linear-gradient(
            transparent,
            rgba(5, 35, 60, .88)
        );

    opacity: 0;

    transition: opacity .3s ease;

}


.shot:hover .shot-caption,
.shot:focus-visible .shot-caption {

    opacity: 1;

}


/* ============================================================
   LIGHTBOX
============================================================ */

.lightbox {

    position: fixed;

    inset: 0;

    z-index: 2000;

    background:
        rgba(3, 20, 34, .96);

    display: none;

    align-items: center;

    justify-content: center;

    padding: 40px;

}


.lightbox.open {

    display: flex;

}


.lightbox img {

    max-height: 82vh;

    object-fit: contain;

}


.lightbox-caption {

    position: absolute;

    bottom: 24px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .14em;

    color: var(--turquoise);

.lightbox-close {

    right: 22px;

    background: none;

    font-size: 22px;

    line-height: 1;

    color: var(--cream);

<!-- ============================================================
     LIGHTBOX SCRIPT
============================================================ -->

<script>

const lightbox =
    document.getElementById("lightbox");

const lightboxImg =
    document.getElementById("lightbox-img");

const lightboxCaption =
    document.getElementById("lightbox-caption");

const closeBtn =
    document.getElementById("lightbox-close");


/* ------------------------------------------------------------
   OPEN LIGHTBOX
------------------------------------------------------------ */

document
    .querySelectorAll(".shot")
    .forEach(shot => {

        shot.addEventListener(
            "click",
            () => {

                const img =
                    shot.querySelector("img");

                const caption =
                    shot.querySelector(
                        ".shot-caption"
                    );


                lightboxImg.src =
                    img.src;

                lightboxImg.alt =
                    img.alt;


                lightboxCaption.textContent =
                    caption
                        ? caption.textContent.trim()
                        : "";


                lightbox.classList.add("open");


                closeBtn.focus();

            }
        );

    });


/* ------------------------------------------------------------
   CLOSE LIGHTBOX
------------------------------------------------------------ */

function closeLightbox() {

    lightbox.classList.remove("open");

    lightboxImg.src = "";

}


/* CLOSE BUTTON */

closeBtn.addEventListener(
    "click",
    closeLightbox
);


/* CLICK OUTSIDE IMAGE */

lightbox.addEventListener(
    "click",
    event => {

        if (
            event.target === lightbox
        ) {

            closeLightbox();

        }

    }
);


/* ESCAPE KEY */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeLightbox();

        }

    }
);

</script>
