/* ============================================================
   COLOURS
============================================================ */

:root {

    --night: #05233C;
    --cream: #F5F5DC;
    --muted: #9DB2C4;

    --turquoise: #28B6AC;
    --saffron: #D0674E;

    --line: rgba(245, 245, 220, .16);

    --wrap: min(960px, calc(100% - 64px));

}


/* ============================================================
   RESET
============================================================ */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

}


html {

    scroll-behavior: smooth;

}


body {

    background: var(--night);

    color: var(--cream);

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    overflow-x: hidden;

}


a {

    color: inherit;

    text-decoration: none;

}


button {

    font-family: inherit;

}


::selection {

    background: var(--turquoise);

    color: var(--night);

}


/* ============================================================
   GENERAL
============================================================ */

h1 {

    font-family: "Montserrat", sans-serif;

    font-weight: 400;

}


.page-width {

    width: var(--wrap);

    margin: 0 auto;

}


.rule {

    width: 100%;

    height: 1px;

    background: var(--line);

}


/* ============================================================
   SMALL LINK
============================================================ */

.link {

    display: inline-block;

    text-transform: uppercase;

    letter-spacing: .12em;

}


.link:hover,
.link:focus-visible {

}


/* ============================================================
   NAVIGATION
============================================================ */

.site-nav {

    left: 0;

    z-index: 1000;

    padding: 16px 0;

    pointer-events: none;

    background:

            var(--night) 60%,

}


.nav-inner {

    width: var(--wrap);

    margin: auto;

    display: flex;

    justify-content: space-between;

    align-items: center;

    pointer-events: auto;

}


.artist-name {

    text-transform: uppercase;

    letter-spacing: .2em;

    color: var(--cream);

    white-space: nowrap;

}


.nav-links {

    gap: 24px;

    list-style: none;

}


.nav-links a {

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .15em;

    color: var(--muted);

}


.nav-links a:hover,
.nav-links a:focus-visible,
.nav-links a.current {

    color: var(--turquoise);

}


/* ============================================================
   PAGE HEADER
============================================================ */

.play-head {

    padding: 110px 0 28px;

}


.play-title {

    font-size:

}


.play-intro {

    max-width: 420px;

    margin-top: 16px;

    font-size: 13px;

    line-height: 1.7;

    color: var(--muted);

}


/* ============================================================
   GALLERY
============================================================ */

.gallery-section {

    padding: 50px 0 70px;

}


.gallery {

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 42px 22px;

    align-items: start;

}


/* ============================================================
   EASY ARTWORK CONTROLS
   ------------------------------------------------------------
   Change ONLY the values below to move/resize each artwork.

   width       = artwork width
   height      = artwork height (use auto to keep proportions)
   move-x      = left/right movement
   move-y      = up/down movement

   Examples:
   --art-width: 85%;
   --art-height: auto;
   --move-x: 20px;
   --move-y: -10px;

   Each artwork has its own control class:
   art-01, art-02, art-03, etc.
============================================================ */

.art-01 {
    --art-width: 60%;
    --art-height: 60;
    --move-x: 0px;
    --move-y: 0px;
}

.art-02 {
    --art-width: 100%;
    --art-height: auto;
    --move-x: 0px;
    --move-y: 0px;
}

.art-03 {
    --art-width: 100%;
    --art-height: auto;
    --move-x: 0px;
    --move-y: -230px;
}

.art-04 {
    --art-width: 50%;
    --art-height: auto;
    --move-x: -10px;
    --move-y: -230px;
}

.art-05 {
    --art-width: 50%;
    --art-height: auto;
    --move-x: -170px;
    --move-y: -230px;
}

.art-06 {
    --art-width: 100%;
    --art-height: auto;
    --move-x: 0px;
    --move-y: -530px;
}

.art-07 {
    --art-width: 50%;
    --art-height: 50;
    --move-x: 0px;
    --move-y: 0px;
}

.art-08 {
    --art-width: 100%;
    --art-height: auto;
    --move-x: 660px;
    --move-y: -1400px;
}

.art-09 {
    --art-width: 100%;
    --art-height: auto;
    --move-x: 0px;
    --move-y: 0px;
}

/* Individual images inside Experiment 04 */
.art-04a,
.art-04b,
.art-04c {
    --art-width: 100%;
    --art-height: auto;
    --move-x: 0px;
    --move-y: 0px;
}

/* Apply the controls to each artwork */
.art-01,
.art-02,
.art-03,
.art-04,
.art-05,
.art-06,
.art-07,
.art-08,
.art-09 {
    width: var(--art-width);
    transform: translate(var(--move-x), var(--move-y));
}

.art-01 img,
.art-02 img,
.art-03 img,
.art-04 img,
.art-05 img,
.art-06 img,
.art-07 img,
.art-08 img,
.art-09 img {
    width: var(--art-width);
    height: var(--art-height);
}

/* Individual artwork images in Experiment 04 */
.art-04a,
.art-04b,
.art-04c {
    display: block;
    width: var(--art-width);
    height: var(--art-height);
    transform: translate(var(--move-x), var(--move-y));
    object-fit: contain;
}

/* ============================================================
   END EASY ARTWORK CONTROLS
============================================================ */

/* ============================================================
   ARTWORK ITEM

   IMPORTANT:
   No fixed height.
   No background.
   No aspect ratio.

   This allows every artwork to keep its
   natural proportions.
============================================================ */

.shot {

    position: relative;

    display: block;

    width: 100%;

    height: auto;

    min-width: 0;

    padding: 0;

    border: 0;

    background: transparent;

    cursor: zoom-in;

    overflow: visible;

}


/* ============================================================
   WIDE ARTWORK
============================================================ */

.shot.wide {

    grid-column: span 2;

}


/* ============================================================
   TALL ARTWORK

   No longer forces the artwork into a 1:2 box.
   Its natural height is respected.
============================================================ */

.shot.tall {

    grid-row: auto;

}


/* ============================================================
   ARTWORK IMAGE + VIDEO

   width: 100%
   height: auto
   object-fit: contain

   This preserves the original aspect ratio.
============================================================ */

.shot img,
.shot video {

    display: block;

    width: 100%;

    height: auto;

    max-width: 100%;

    object-fit: contain;

    object-position: center;

}

/* Keep individual artwork sizes from the controls above */
.art-01 img,
.art-02 img,
.art-03 img,
.art-04 img,
.art-05 img,
.art-06 img,
.art-07 img,
.art-08 img,
.art-09 img {
    width: var(--art-width);
    height: var(--art-height);
}

/* ============================================================
   CAPTION
============================================================ */

.shot-caption {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        32px 12px 10px;

    text-align: left;

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: .12em;

    color: var(--cream);

    background:
        linear-gradient(
            transparent,
            rgba(5, 35, 60, .9)
        );

    opacity: 0;

}


/* Caption appears without animation */

.shot:hover .shot-caption,
.shot:focus-visible .shot-caption {

    opacity: 1;

}


/* ============================================================
   LIGHTBOX
============================================================ */

.lightbox {

    position: fixed;

    inset: 0;

    z-index: 2000;

    background:
        rgba(3, 20, 34, .96);

    display: none;

    align-items: center;

    justify-content: center;

    padding: 40px;

}


.lightbox.open {

    display: flex;

}


/* ============================================================
   LIGHTBOX ARTWORK

   Natural size / natural aspect ratio.
   Never cropped.
============================================================ */

.lightbox img,
.lightbox video {

    display: block;

    width: auto;

    height: auto;

    max-width: 92vw;

    max-height: 82vh;

    object-fit: contain;

}


/* ============================================================
   LIGHTBOX CAPTION
============================================================ */

.lightbox-caption {

    bottom: 24px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 10px;

    text-transform: uppercase;

/* ============================================================

<script>

const lightbox =
    document.getElementById("lightbox");


const lightboxImg =
    document.getElementById("lightbox-img");


const lightboxVideo =
    document.getElementById("lightbox-video");


const lightboxCaption =
    document.getElementById("lightbox-caption");


const closeBtn =
    document.getElementById("lightbox-close");


/* ============================================================
   OPEN LIGHTBOX
============================================================ */

document
    .querySelectorAll(".shot")
    .forEach(shot => {

        shot.addEventListener(
            "click",
            () => {

                const type =
                    shot.dataset.type;

                const source =
                    shot.dataset.src;

                const caption =
                    shot.querySelector(
                        ".shot-caption"
                    );


                /* -------------------------
                   RESET
                ------------------------- */

                lightboxImg.style.display =
                    "none";

                lightboxVideo.style.display =
                    "none";

                lightboxVideo.pause();

                lightboxVideo.removeAttribute(
                    "src"
                );


                /* -------------------------
                   IMAGE
                ------------------------- */

                if (type === "image") {

                    lightboxImg.src =
                        source;

                    lightboxImg.alt =
                        "Enlarged experiment";

                    lightboxImg.style.display =
                        "block";

                }


                /* -------------------------
                   VIDEO
                ------------------------- */

                if (type === "video") {

                    lightboxVideo.src =
                        source;

                    lightboxVideo.style.display =
                        "block";

                    lightboxVideo.load();

                    lightboxVideo.play()
                        .catch(() => {});

                }


                /* -------------------------
                   CAPTION
                ------------------------- */

                lightboxCaption.textContent =
                    caption
                        ? caption.textContent.trim()
                        : "";


                /* -------------------------
                   OPEN
                ------------------------- */

                lightbox.classList.add("open");


                closeBtn.focus();

            }
        );

    });


/* ============================================================
   CLOSE LIGHTBOX
============================================================ */

function closeLightbox() {

    lightbox.classList.remove("open");


    lightboxImg.src = "";


    lightboxVideo.pause();

    lightboxVideo.removeAttribute(
        "src"
    );

    lightboxVideo.load();

}


/* ============================================================
   CLOSE BUTTON
============================================================ */

closeBtn.addEventListener(
    "click",
    closeLightbox
);


/* ============================================================
   CLICK OUTSIDE
============================================================ */

lightbox.addEventListener(
    "click",
    event => {

        if (
            event.target === lightbox
        ) {

            closeLightbox();

        }

    }
);


/* ============================================================
   ESCAPE KEY
============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeLightbox();

        }

    }
);

</script>


</body>
